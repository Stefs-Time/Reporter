<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Feedback Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header no-print">
  <h1>Project Feedback Tracker</h1>
  <div class="header-actions">
    <button id="btnNewProject" class="btn btn-primary">+ New Project</button>
    <button id="btnPrintAll" class="btn">Print All</button>
    <button id="btnExport" class="btn">Export Data</button>
    <label class="btn" for="importFile">Import Data</label>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</header>

<div class="app-body">

  <aside class="sidebar no-print">
    <div class="sidebar-search">
      <input type="text" id="searchBox" placeholder="Search owner or project...">
    </div>
    <ul id="projectList" class="project-list"></ul>
  </aside>

  <main class="editor no-print" id="editorPane">
    <div id="emptyState" class="empty-state">
      <p>Select a project on the left, or click <strong>+ New Project</strong> to add one.</p>
    </div>

    <form id="projectForm" class="project-form" hidden>
      <input type="hidden" id="projectId">

      <div class="form-row">
        <div class="form-field">
          <label for="ownerInput">Responsible Owner</label>
          <input type="text" id="ownerInput" required placeholder="e.g. Stefan Botha">
        </div>
        <div class="form-field">
          <label for="nameInput">Project Name</label>
          <input type="text" id="nameInput" required placeholder="e.g. Sales Dashboard Revamp">
        </div>
      </div>

      <div class="form-field">
        <label for="detailInput">Latest Feedback / Status Caption</label>
        <textarea id="detailInput" rows="2" placeholder="Short caption on where the project currently stands"></textarea>
      </div>

      <div class="form-field">
        <label for="highlightsInput">Key Highlights</label>
        <textarea id="highlightsInput" rows="3" placeholder="One item per line"></textarea>
      </div>

      <div class="form-field">
        <label for="progressInput">In Progress</label>
        <textarea id="progressInput" rows="3" placeholder="One item per line"></textarea>
      </div>

      <div class="form-field">
        <label for="risksInput">Risks</label>
        <textarea id="risksInput" rows="3" placeholder="One item per line"></textarea>
      </div>

      <div class="form-field">
        <label for="onHoldInput">On Hold</label>
        <textarea id="onHoldInput" rows="3" placeholder="One item per line"></textarea>
      </div>

      <div class="form-field">
        <label for="itRequestsInput">Support Requests Opened to IT</label>
        <textarea id="itRequestsInput" rows="3" placeholder="One item per line"></textarea>
      </div>

      <div class="form-field">
        <label for="powerBiInput">Open Help Desk Requests with Power BI Department</label>
        <textarea id="powerBiInput" rows="3" placeholder="One item per line"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="btnPrintOne" class="btn">Print</button>
        <button type="button" id="btnDelete" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </main>

</div>

<section id="printArea" class="print-only"></section>

<script src="app.js"></script>
</body>
</html>
